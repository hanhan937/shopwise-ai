server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /api/health -> http://backend:8000/health  (trailing slash on proxy_pass strips the prefix)
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri /index.html;
  }
}
